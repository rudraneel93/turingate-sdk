<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Agent Readiness Check</title>
<style>
:root { --bg:#0a0a13; --ink:#f4f4f8; --mute:#a3a5bc; --dim:#686a82; --edge:rgba(255,255,255,.1); --ok:#6ff3b9; --bad:#ff5c8a; --warn:#ffb547; --c:#2ee6f0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; width: 360px; background: var(--bg); color: var(--ink); font: 13.5px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--edge); }
header img { width: 20px; height: 20px; } header b { font-size: 13px; } header span { margin-left: auto; color: var(--dim); font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { padding: 14px; }
.score { display: flex; align-items: center; gap: 14px; }
.num { font: 700 40px/1 ui-sans-serif, system-ui; letter-spacing: -.04em; }
.num small { font-size: 14px; color: var(--dim); font-weight: 500; }
.grade { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; font-weight: 800; font-size: 17px; color: #05050a; }
.A { background: var(--ok); } .B { background: #b6ff6b; } .C { background: var(--warn); } .D, .F { background: var(--bad); }
.sum { color: var(--mute); margin: 10px 0 12px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 8px; background: rgba(255,255,255,.03); }
li i { font-style: normal; font-weight: 800; } .pass i { color: var(--ok); } .fail i { color: var(--bad); } .warn i { color: var(--warn); }
li em { font-style: normal; color: var(--dim); font-size: 12px; white-space: nowrap; }
a.btn { display: block; text-align: center; margin-top: 12px; padding: 10px; border-radius: 99px; background: var(--ink); color: #05050a; font-weight: 700; text-decoration: none; }
.err { color: var(--bad); } .muted { color: var(--dim); font-size: 12px; margin-top: 10px; }
.spin { width: 16px; height: 16px; border: 2px solid var(--edge); border-top-color: var(--c); border-radius: 50%; animation: s .8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
@keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><img src="icons/icon32.png" alt=""><b>AI Agent Readiness</b><span id="host"></span></header>
<main id="out"><span class="spin"></span>Checking how AI agents see this site… (about 20 seconds)</main>
<script src="popup.js"></script>
</body>
</html>
