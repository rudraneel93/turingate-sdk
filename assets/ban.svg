<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Shared reputation: three sites report the same abusive agent, Turingate blocks it and its owner, and every site rejects it.">
  <defs><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><clipPath id="c"><rect width="900" height="290" rx="20"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="900" height="290" fill="#05050c"/>
    <g class="s" text-anchor="middle" font-size="26">
      <g transform="translate(120 70)"><rect x="-44" y="-30" width="88" height="60" rx="14" fill="#0d0d1a" stroke="#fff" stroke-opacity=".16"/><text y="9">🛒</text><text y="52" font-size="13" fill="#a3a5bc">Shop</text>
        <rect x="-44" y="-30" width="88" height="60" rx="14" fill="none" stroke="#ff5c8a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.08;.1;.92;1" dur="10s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(120 190)"><rect x="-44" y="-30" width="88" height="60" rx="14" fill="#0d0d1a" stroke="#fff" stroke-opacity=".16"/><text y="9">✈️</text><text y="52" font-size="13" fill="#a3a5bc">Airline</text>
        <rect x="-44" y="-30" width="88" height="60" rx="14" fill="none" stroke="#ff5c8a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.24;.26;.92;1" dur="10s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(780 70)"><rect x="-44" y="-30" width="88" height="60" rx="14" fill="#0d0d1a" stroke="#fff" stroke-opacity=".16"/><text y="9">💬</text><text y="52" font-size="13" fill="#a3a5bc">Forum</text>
        <rect x="-44" y="-30" width="88" height="60" rx="14" fill="none" stroke="#ff5c8a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.42;.92;1" dur="10s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(780 190)"><rect x="-44" y="-30" width="88" height="60" rx="14" fill="#0d0d1a" stroke="#fff" stroke-opacity=".16"/><text y="9">🏦</text><text y="52" font-size="13" fill="#a3a5bc">Bank</text>
        <rect x="-44" y="-30" width="88" height="60" rx="14" fill="none" stroke="#ff5c8a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.55;.62;.64;.92;1" dur="10s" repeatCount="indefinite"/></rect></g>
    </g>
    <g stroke="#fff" stroke-opacity=".12" stroke-dasharray="5 7" stroke-width="2"><path d="M164 70L400 120M164 190L400 140M736 70L500 120M736 190L500 140"/></g>
    <g transform="translate(450 130)">
      <rect x="-70" y="-44" width="140" height="88" rx="22" fill="#0d0d1a" stroke="#2ee6f0" stroke-opacity=".6"/>
      <rect x="-70" y="-44" width="140" height="88" rx="22" fill="#ff5c8a" fill-opacity=".14" stroke="#ff5c8a" stroke-width="2.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.52;.92;1" dur="10s" repeatCount="indefinite"/></rect>
      <text class="s" text-anchor="middle" y="-6" font-size="16" font-weight="700" fill="#f4f4f8">Turingate</text>
      <text class="m" text-anchor="middle" y="20" font-size="13" fill="#a3a5bc">spam-bot</text>
    </g>
    <text x="450" y="272" class="m" font-size="14" text-anchor="middle" fill="#686a82">
      <tspan>3 abuse reports → agent + owner blocked everywhere · email &amp; card banned</tspan></text>
    <g class="m" font-size="13" text-anchor="middle">
      <text x="450" y="40" fill="#ffb547" opacity="0">🚩 report 1/3<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.08;.1;.24;1" dur="10s" repeatCount="indefinite"/></text>
      <text x="450" y="40" fill="#ffb547" opacity="0">🚩 report 2/3<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.24;.26;.4;1" dur="10s" repeatCount="indefinite"/></text>
      <text x="450" y="40" fill="#ffb547" opacity="0">🚩 report 3/3<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.4;.42;.5;1" dur="10s" repeatCount="indefinite"/></text>
      <text x="450" y="40" fill="#ff5c8a" opacity="0">⛔ blocked on every site<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.52;.92;1" dur="10s" repeatCount="indefinite"/></text>
    </g>
  </g>
</svg>
