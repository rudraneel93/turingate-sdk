<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Terminal: set up an identity, delegate to your agent, connect the MCP server, and the agent gets a pass.">
  <defs><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}</style><clipPath id="c"><rect width="900" height="360" rx="18"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="900" height="360" fill="#0a0a14"/><rect width="900" height="40" fill="#14142a"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
    <text x="450" y="25" text-anchor="middle" class="m" font-size="13" fill="#686a82">~/my-agent</text>
    <g class="m">
      <g><animate attributeName="opacity" values="1;1;0" keyTimes="0;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="78" fill="#2ee6f0">$</text><text x="42" y="78" fill="#f4f4f8">npx turingate principal init --name "Ada Lovelace"</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.12;.14;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="42" y="102" fill="#6ff3b9">✓ identity p_yRmw… registered</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.22;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="138" fill="#2ee6f0">$</text><text x="42" y="138" fill="#f4f4f8">npx turingate agent init --name claude-code</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.34;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="174" fill="#2ee6f0">$</text><text x="42" y="174" fill="#f4f4f8">npx turingate delegate --scopes "bookings:*" --spend 50</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.44;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="42" y="198" fill="#6ff3b9">✓ claude-code may book, up to $50, for 24h</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.52;.54;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="234" fill="#2ee6f0">$</text><text x="42" y="234" fill="#f4f4f8">claude mcp add turingate -- npx -y turingate-mcp</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.66;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="270" fill="#7c5cff">agent ›</text><text x="96" y="270" fill="#cfd1e2">rc_get_challenge → solving 20 tasks…</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.76;.78;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="296" fill="#7c5cff">agent ›</text><text x="96" y="296" fill="#b6ff6b">✓ passed 20/20 in 5.4s · pass valid for 10 min</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.86;.88;.97;1" dur="12s" repeatCount="indefinite"/>
        <text x="24" y="322" fill="#7c5cff">agent ›</text><text x="96" y="322" fill="#cfd1e2">Authorization: AgentPass eyJhbGciOiJFZERTQSIs…</text></g>
      <rect x="24" y="334" width="10" height="16" fill="#2ee6f0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
