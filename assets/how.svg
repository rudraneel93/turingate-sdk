<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How it works: a human delegates to an AI agent, the agent passes the reverse CAPTCHA at Turingate and gets a signed pass, then presents it to your site, which verifies it.">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#2ee6f0"/><stop offset="1" stop-color="#b6ff6b"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#05050c"/>
    <path id="track" d="M150 130 H1050" stroke="#fff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 8" fill="none"/>
    <!-- nodes -->
    <g class="sans" text-anchor="middle">
      <g transform="translate(150 130)"><circle r="46" fill="#0d0d1a" stroke="#fff" stroke-opacity=".18"/><text y="12" font-size="34">🧑</text>
        <circle r="46" fill="none" stroke="#b6ff6b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;.2;.4;.6;.8;1" dur="8s" repeatCount="indefinite"/></circle>
        <text y="82" font-size="17" font-weight="700" fill="#f4f4f8">1 · The human</text><text y="106" font-size="14" fill="#a3a5bc">signs a permission slip</text></g>
      <g transform="translate(450 130)"><circle r="46" fill="#0d0d1a" stroke="#fff" stroke-opacity=".18"/><text y="12" font-size="34">🤖</text>
        <circle r="46" fill="none" stroke="#b6ff6b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;.25;.45;.6;.8;1" dur="8s" repeatCount="indefinite"/></circle>
        <text y="82" font-size="17" font-weight="700" fill="#f4f4f8">2 · The agent</text><text y="106" font-size="14" fill="#a3a5bc">takes the reverse CAPTCHA</text></g>
      <g transform="translate(750 130)"><circle r="46" fill="#0d0d1a" stroke="#2ee6f0" stroke-opacity=".6"/>
        <path d="M-15 18V-2a15 15 0 0 1 30 0v20" stroke="#2ee6f0" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="16" cy="-14" r="4" fill="#b6ff6b"/>
        <circle r="46" fill="none" stroke="#b6ff6b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;.3;.5;.7;.8;1" dur="8s" repeatCount="indefinite"/></circle>
        <text y="82" font-size="17" font-weight="700" fill="#f4f4f8">3 · Turingate</text><text y="106" font-size="14" fill="#a3a5bc">issues a signed pass</text></g>
      <g transform="translate(1050 130)"><circle r="46" fill="#0d0d1a" stroke="#fff" stroke-opacity=".18"/><text y="12" font-size="34">🌐</text>
        <circle r="46" fill="none" stroke="#6ff3b9" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.5;.7;.75;.95;1" dur="8s" repeatCount="indefinite"/></circle>
        <text y="82" font-size="17" font-weight="700" fill="#f4f4f8">4 · Your site</text><text y="106" font-size="14" fill="#a3a5bc">verifies it, lets it in</text></g>
    </g>
    <!-- travelling token -->
    <g>
      <rect x="-46" y="-15" width="92" height="30" rx="15" fill="#11111f" stroke="url(#g)" stroke-width="2"/>
      <text class="mono" font-size="12" fill="#b6ff6b" text-anchor="middle" y="4">
        <tspan>slip ✍︎<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.3;.31;1" dur="8s" repeatCount="indefinite"/></tspan></text>
      <text class="mono" font-size="12" fill="#2ee6f0" text-anchor="middle" y="4" opacity="0">20/20 ✓<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.3;.31;.5;.51;1" dur="8s" repeatCount="indefinite"/></text>
      <text class="mono" font-size="12" fill="#6ff3b9" text-anchor="middle" y="4" opacity="0">PASS 🔑<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.5;.51;1" dur="8s" repeatCount="indefinite"/></text>
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;.333;.333;.667;.667;1;1" keyTimes="0;.08;.28;.38;.5;.55;.75;1" calcMode="linear" path="M150 60 H1050"/>
    </g>
    <text x="600" y="282" class="mono" font-size="13" fill="#686a82" text-anchor="middle">Authorization: AgentPass eyJhbGciOiJFZERTQSIs…  →  POST /v1/verify  →  { "valid": true }</text>
  </g>
</svg>
