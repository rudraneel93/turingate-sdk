name: Accessibility barrier
description: Something stopped you, or made it hard, to use Turingate with assistive technology
labels: [accessibility]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations: { required: true }
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser, device, and assistive technology
      placeholder: "e.g. Safari 18 on iOS with VoiceOver"
